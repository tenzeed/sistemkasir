<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!--
      Capture the browser's install signal IMMEDIATELY, before anything
      else on the page loads. If we wait until React mounts to start
      listening, the browser may have already fired this event and shown
      its own default install banner in the meantime — which is exactly
      the "looks like an ad, then disappears, never comes back" behavior
      this script exists to prevent. Storing it on `window` means any
      component that mounts later (Setup, PIN login, Settings) can still
      pick it up, no matter which screen happened to be showing when it
      actually fired.
    -->
    <script>
      window.__pwaInstallEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallEvent = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaInstallEvent = null;
        window.dispatchEvent(new CustomEvent('pwa-install-done'));
      });
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6b4c" />
    <title>Warung Manager</title>
    <meta name="description" content="Aplikasi manajemen warung — stok, EXP/FEFO, transaksi, keuangan, dan laporan." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- iOS "Add to Home Screen" support (iOS ignores the web manifest for icons/behavior) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Warung" />
  </head>
  <body class="bg-ink-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
